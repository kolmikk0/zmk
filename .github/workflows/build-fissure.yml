name: Build Fissure Firmware

on:
  push:
    branches:
      - fissure3.3-working
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:3.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: West Init
        run: |
          west init -l app/
          west update
          west zephyr-export

      - name: Build Left
        run: |
          west build -s app -p -b fissure_left -d build/left

      - name: Build Right
        run: |
          west build -s app -p -b fissure_right -d build/right

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          echo "=== Left outputs ==="
          ls -la build/left/zephyr/
          echo "=== Right outputs ==="
          ls -la build/right/zephyr/
          for ext in hex bin elf uf2; do
            if [ -f "build/left/zephyr/zmk.$ext" ]; then cp "build/left/zephyr/zmk.$ext" "artifacts/fissure_left.$ext"; fi
            if [ -f "build/left/zephyr/zephyr.$ext" ]; then cp "build/left/zephyr/zephyr.$ext" "artifacts/fissure_left.$ext"; fi
            if [ -f "build/right/zephyr/zmk.$ext" ]; then cp "build/right/zephyr/zmk.$ext" "artifacts/fissure_right.$ext"; fi
            if [ -f "build/right/zephyr/zephyr.$ext" ]; then cp "build/right/zephyr/zephyr.$ext" "artifacts/fissure_right.$ext"; fi
          done
          echo "=== Prepared Artifacts ==="
          ls -la artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fissure-firmware
          path: artifacts/*
